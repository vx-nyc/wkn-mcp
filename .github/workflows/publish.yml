name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.0.3
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Resolve publish tag
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' must match v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g 'npm@^11.5.1'

      - run: npm ci

      - name: Sync package version from tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="${RELEASE_TAG#v}"
          npm version --no-git-tag-version "$package_version"

      - run: npm run build

      - name: Resolve npm publish auth mode
        id: npm_auth
        run: |
          set -euo pipefail
          if npm view @vx-nyc/vx-mcp version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "Package exists on npm; publishing with GitHub OIDC trusted publishing."
          else
            echo "mode=bootstrap-token" >> "$GITHUB_OUTPUT"
            echo "Package is not on npm yet; publishing with bootstrap token."
          fi

      - name: Verify npm bootstrap token
        if: steps.npm_auth.outputs.mode == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::A working npm publish token is required for the first @vx-nyc/vx-mcp publish before trusted publishing can take over."
            exit 1
          fi
          npm whoami

      - name: Publish to npm with bootstrap token
        if: steps.npm_auth.outputs.mode == 'bootstrap-token'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm with trusted publishing
        if: steps.npm_auth.outputs.mode == 'trusted'
        run: npm publish --access public

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
