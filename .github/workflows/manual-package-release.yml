name: Manual Package Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New package tag to create, for example v1.0.3
        required: true
        type: string
      target_ref:
        description: Branch, tag, or SHA to release from
        required: true
        default: main
        type: string

concurrency:
  group: manual-package-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Create tag and dispatch publish
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' must match v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi

      - name: Refuse duplicate tag or release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists."
            exit 1
          fi

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Create and push package tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$sha" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $sha"

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"
