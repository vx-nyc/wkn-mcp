name: Manual Package Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New package tag to create, for example v1.0.3
        required: true
        type: string
      target_ref:
        description: Branch, tag, or SHA to release from
        required: true
        default: main
        type: string

concurrency:
  group: manual-package-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Create tag and dispatch publish
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' must match v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Resolve npm publish auth mode
        id: npm_auth
        run: |
          set -euo pipefail
          if npm view @vx-nyc/vx-mcp version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "Package exists on npm; publish.yml will use npm trusted publishing."
          else
            echo "mode=bootstrap-token" >> "$GITHUB_OUTPUT"
            echo "Package is not on npm yet; the first publish still needs a working npm token."
          fi

      - name: Verify npm bootstrap token before tagging
        if: steps.npm_auth.outputs.mode == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::A working npm publish token is required for the first package publish before trusted publishing can take over."
            exit 1
          fi
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::The npm publish token is present but npm rejected it. Refresh the bootstrap token before creating a release tag."
            exit 1
          fi

      - name: Refuse duplicate tag or release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists."
            exit 1
          fi

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Create and push package tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$sha" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $sha"

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"
